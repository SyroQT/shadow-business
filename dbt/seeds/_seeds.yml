version: 2

seeds:
  - name: category_evrk
    description: >
      Category to EVRK prefix map. Mirrors config/categories.yaml
      (a pytest test keeps them in sync).
    config:
      column_types:
        category: varchar
        evrk_prefix: varchar
    columns:
      - name: category
        data_tests: [not_null]
      - name: evrk_prefix
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [category, evrk_prefix]

  - name: category_lead_rules
    description: >
      Per-category lead rules (minimum reviews, analyst caveat, display label).
      One row per category in config/categories.yaml (a pytest test keeps them in sync).
    config:
      column_types:
        category: varchar
        min_reviews: integer
        caveat: varchar
        label: varchar
    columns:
      - name: category
        data_tests: [unique, not_null]
      - name: min_reviews
        data_tests: [not_null]
      - name: caveat
        data_tests: [not_null]
      - name: label
        data_tests: [not_null]
