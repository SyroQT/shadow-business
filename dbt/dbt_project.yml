name: leads
version: "0.1.0"
config-version: 2
profile: leads

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

models:
  leads:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  leads:
    +schema: staging

vars:
  low_wage_margin: 0.10    # "near" the minimum: avg_wage <= minimum wage (seed minimum_wage) * 1.10
  busy_multiple: 2.0       # busy = at least this multiple of the category median reviews per employee
  min_peers: 5             # fewest eligible companies in a category for its median to count
