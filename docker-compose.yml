# Usage: README "Quick start" and "Run types".
services:
  demo:
    image: oxylabs-leads
    build: .
    entrypoint: ["python", "-m", "src.cli", "demo"]
    volumes:
      - ./output:/app/output

  full:
    image: oxylabs-leads
    build: .
    entrypoint: ["python", "-m", "src.cli", "full"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./snapshots:/app/snapshots

  snapshot:
    image: oxylabs-leads
    build: .
    entrypoint: ["python", "-m", "src.cli", "snapshot"]
    volumes:
      - ./data:/app/data
      - ./snapshots:/app/snapshots
