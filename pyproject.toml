[project]
name = "oxylabs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Titas Janušois", email = "titas.januson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: hits real APIs (needs LIVE=1)",
    "recorded: needs tests/fixtures/recorded/",
]
